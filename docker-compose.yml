services:
  db:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: worksphere, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}", POSTGRES_DB: worksphere}
    volumes: [pgdata:/var/lib/postgresql/data, ./db/migrations:/docker-entrypoint-initdb.d:ro]
    healthcheck: {test: ["CMD-SHELL","pg_isready -U worksphere"], interval: 5s, retries: 10}
    networks: [internal]
  redis:
    image: redis:7-alpine
    healthcheck: {test: ["CMD","redis-cli","ping"], interval: 5s, retries: 10}
    networks: [internal]
  api:
    build: ./api
    env_file: .env
    depends_on: {db: {condition: service_healthy}, redis: {condition: service_started}}
    ports: ["3000:3000"]
    networks: [internal]
  worker:
    build: ./api
    command: node src/worker.js
    env_file: .env
    depends_on: {db: {condition: service_healthy}}
    networks: [internal]
  analytics:
    build: ./analytics
    env_file: .env
    networks: [internal]
  frontend:
    build: ./frontend
    env_file: .env
    depends_on: [api]
    ports: ["3001:3000"]
    networks: [internal]
volumes: {pgdata: {}}
networks: {internal: {}}
