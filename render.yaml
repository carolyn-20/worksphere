services:
  - type: web
    name: worksphere-api
    runtime: node
    plan: free
    buildCommand: cd api && npm ci
    startCommand: cd api && node src/migrate.js && npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: worksphere-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SERVICE_KEY
        generateValue: true
      - key: CORS_ORIGIN
        value: https://worksphere-frontend.onrender.com
      - key: ANALYTICS_URL
        value: https://worksphere-analytics.onrender.com

  - type: web
    name: worksphere-analytics
    runtime: python
    plan: free
    buildCommand: pip install -r analytics/requirements.txt
    startCommand: cd analytics && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SERVICE_KEY
        fromService:
          name: worksphere-api
          type: web
          envVarKey: SERVICE_KEY

  - type: web
    name: worksphere-frontend
    runtime: node
    plan: free
    buildCommand: cd frontend && npm ci && npm run build
    startCommand: cd frontend && npm start -- -p $PORT
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://worksphere-api.onrender.com/api/v1

databases:
  - name: worksphere-db
    plan: free
    databaseName: worksphere
    user: worksphere
